<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="hamburger" onclick="toggleMenu()">☰</div>

<div id="sideMenu" class="side-menu">
    <div class="side-menu-header">
        <p>👤 {{ user[0] }}</p>
    </div>

    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/scan">📤 New Scan</a>
    <a href="/history">📜 My History</a>
    <a href="/profile">👤 My Profile</a>
    <a href="/about">ℹ️ About</a>

    <div class="side-menu-footer">
        <a href="/logout">🚪 Logout</a>
    </div>
</div>

<div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>

<div class="container">
    <h1>👤 My Profile</h1>

    <div class="card" style="text-align:center;">
        {% if user[4] %}
            <img src="{{ url_for('static', filename=user[4]) }}" class="profile-pic">
        {% else %}
            <img src="{{ url_for('static', filename='default_avatar.png') }}" class="profile-pic">
        {% endif %}
    </div>

    <div class="card">
        <h3>📝 Edit Profile</h3>
        <form method="POST" enctype="multipart/form-data">

            <label>Profile Photo</label>
            <input type="file" name="profile_image" accept="image/*">

            <label>Username (cannot change)</label>
            <input type="text" value="{{ user[0] }}" disabled>

            <label>Full Name</label>
            <input type="text" name="full_name" value="{{ user[1] or '' }}">

            <label>Email</label>
            <input type="email" name="email" value="{{ user[2] or '' }}">

            <label>Role in Organization</label>
            <input type="text" name="role" value="{{ user[3] or '' }}">

            <br>
            <button type="submit">💾 Save Profile</button>
        </form>
    </div>

    <div class="image-grid">
        <div class="card">
            <h3>📊 Total Scans</h3>
            <p style="font-size:28px;">{{ total_scans }}</p>
        </div>

        <div class="card">
            <h3>🕒 Last Scan</h3>
            <p>{{ last_scan }}</p>
        </div>
    </div>

    <footer>
        Marine Oil Spill Detection Using Deep Learning
    </footer>
</div>

<script>
function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    const overlay = document.getElementById("menuOverlay");
    menu.classList.toggle("active");
    overlay.classList.toggle("active");
}
</script>

</body>
</html>
