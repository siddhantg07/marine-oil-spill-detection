<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Scan History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Hamburger Button -->
<div class="hamburger" onclick="toggleMenu()">☰</div>

<!-- Sidebar Menu -->
<div id="sideMenu" class="side-menu">
    <div class="side-menu-header">
        <p>👤 {{ session['user'] }}</p>
    </div>

    <a href="/dashboard">🏠 Dashboard</a>
    <a href="/scan">📤 New Scan</a>
    <a href="/history">📜 My History</a>
    <a href="/profile">👤 My Profile</a>

    <div class="side-menu-footer">
        <a href="/logout">🚪 Logout</a>
    </div>
</div>

<!-- Overlay -->
<div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>

<div class="container">
    <h1>📜 My Scan History</h1>

    {% if history %}
        <div class="history-grid">
            {% for h in history %}
                <div class="history-card">
                    <p class="history-date">🕒 {{ h[4] }}</p>

                    <div class="history-images">
                        <img src="{{ url_for('static', filename=h[0]) }}">
                        <img src="{{ url_for('static', filename=h[2]) }}">
                    </div>

                    <div class="history-actions">
                        <a href="{{ url_for('static', filename=h[3]) }}" download>
                            <button>📄 Download Report</button>
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="no-history">No scans yet.</p>
    {% endif %}

    <footer>
        Marine Oil Spill Detection Using Deep Learning
    </footer>
</div>

<!-- JS -->
<script>
function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    const overlay = document.getElementById("menuOverlay");

    menu.classList.toggle("active");
    overlay.classList.toggle("active");
}
</script>

</body>
</html>
